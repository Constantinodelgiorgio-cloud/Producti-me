<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Producti-Me Prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
<style>
/* Layout: una sola superficie de instrumento. Móvil = columna + barra inferior; escritorio (container ≥ 980px) = barra lateral + tablero de 2 columnas.
   Firma visual: "el horizonte" — la luz del borde superior del panel principal ES el progreso del día. La luz se gana. */
:root{
  color-scheme:dark;
  --bg:#08090B; --bg-2:#0B0C0F; --surface:#0E1013; --surface-2:#13151A; --surface-3:#1A1D22;
  --line:#1E2127; --line-2:#2A2E36; --control:#60676F;
  --t1:#F5F6F8; --t2:#A0A6B2; --t3:#7C828E;
  --accent:#8EA8FF; --accent-2:#C3D0FF; --accent-ink:#0A0D18; --accent-soft:rgba(142,168,255,.10); --accent-glow:rgba(142,168,255,.45);
  --success:#5FBF92; --warn:#E0A852; --danger:#E5766F;
  --gold:#D4B26A; --silver:#C2C7D0; --bronze:#C08C6A;
  --font:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --r-1:8px; --r-2:12px; --r-3:16px; --r-4:22px;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.3,.5,1);
  --d-1:120ms; --d-2:220ms; --d-3:360ms;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--t1);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.ic{width:1.15em;height:1.15em;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:none;box-shadow:0 0 0 1px var(--bg),0 0 0 3px var(--accent-glow)!important;border-radius:var(--r-1)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;transition-duration:1ms!important}}

/* ---------- barra de revisión del prototipo (no es parte de la app) ---------- */
.review{flex:none;display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--bg-2);font-size:12px;color:var(--t3);overflow-x:auto;scrollbar-width:none}
.review::-webkit-scrollbar{display:none}
.review .tag-proto{font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;font-size:10.5px;color:var(--t2);white-space:nowrap}
.seg{display:inline-flex;padding:2px;border-radius:9px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);flex:none}
.seg button{padding:5px 9px;border-radius:7px;color:var(--t3);font-size:12px;white-space:nowrap;transition:color var(--d-1),background var(--d-1)}
.seg button:hover{color:var(--t1)}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--t1);box-shadow:inset 0 0 0 1px var(--line-2)}
.review .lbl{white-space:nowrap}

/* ---------- escenario ---------- */
.stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:stretch}
.stage.framed{align-items:center;padding:20px 16px;background:radial-gradient(800px 400px at 50% 0%,rgba(142,168,255,.05),transparent 70%),var(--bg)}
.shell{position:relative;flex:1;min-width:0;display:flex;overflow:hidden;container:app/inline-size;background:var(--bg)}
.framed .shell{flex:none;width:390px;max-width:100%;height:min(844px,100%);border-radius:44px;box-shadow:0 0 0 1px var(--line-2),0 0 0 10px #0d0e11,0 0 0 11px var(--line),0 40px 80px -30px rgba(0,0,0,.9)}

/* ---------- navegación ---------- */
.side{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scroll-behavior:smooth}
.page{padding:20px 16px 28px;max-width:1120px;margin:0 auto;width:100%}
.framed .page{padding-top:54px}
.tabbar{flex:none;display:flex;justify-content:space-around;align-items:flex-start;padding:8px 6px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(8,9,11,.82);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);border-top:1px solid var(--line);position:relative;z-index:5}
.framed .tabbar{padding-bottom:26px}
.tab{flex:1;max-width:84px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0 0;color:var(--t3);font-size:10.5px;font-weight:500;letter-spacing:.01em;position:relative;transition:color var(--d-1)}
.tab .ic{font-size:21px}
.tab:hover{color:var(--t2)}
.tab[aria-current="page"]{color:var(--t1)}
.tab[aria-current="page"] .ic{color:var(--accent)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-9px;width:18px;height:2px;border-radius:2px;background:var(--accent);box-shadow:0 0 10px var(--accent-glow)}
.tab-add{display:grid;place-items:center;width:46px;height:46px;margin-top:-4px;border-radius:15px;color:var(--accent-ink);background:linear-gradient(180deg,#A9BEFF,#8EA8FF);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 22px -8px var(--accent-glow),0 0 0 1px rgba(142,168,255,.5);transition:transform var(--d-1) var(--ease)}
.tab-add .ic{font-size:22px;stroke-width:2.2}
.tab-add:active{transform:scale(.94)}

@container app (min-width:980px){
  .side{display:flex;flex-direction:column;width:236px;flex:none;border-right:1px solid var(--line);padding:20px 12px;gap:2px;background:var(--bg-2)}
  .tabbar{display:none}
  .page{padding:28px 36px 48px}
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand b{font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;font-weight:500}
.side-btn{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-1);color:var(--t2);font-size:14px;transition:background var(--d-1),color var(--d-1)}
.side-btn:hover{background:var(--surface-2);color:var(--t1)}
.side-btn[aria-current="page"]{background:var(--surface-3);color:var(--t1);box-shadow:inset 0 0 0 1px var(--line-2)}
.side-btn[aria-current="page"] .ic{color:var(--accent)}
.side-btn kbd,.kbd{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--t3);padding:1px 6px;border-radius:5px;box-shadow:inset 0 0 0 1px var(--line-2)}
.side-sep{height:1px;background:var(--line);margin:10px 8px}
.side-cta{display:flex;align-items:center;gap:10px;padding:9px 10px;margin-bottom:10px;border-radius:var(--r-2);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-2);color:var(--t1);font-weight:550;font-size:14px}
.side-cta .ic{color:var(--accent)}
.side-foot{margin-top:auto;padding:10px;font-size:12px;color:var(--t3)}

/* ---------- tipografía ---------- */
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);font-weight:500}
.h1{font-size:26px;font-weight:600;letter-spacing:-.03em;line-height:1.15;margin:4px 0 0;text-wrap:balance}
.h2{font-size:15px;font-weight:600;letter-spacing:-.01em;margin:0}
.body-2{font-size:13.5px;color:var(--t2)}
.cap{font-size:12px;color:var(--t3)}
.val-xl{font-size:44px;font-weight:600;letter-spacing:-.045em;line-height:1}
.val-l{font-size:28px;font-weight:600;letter-spacing:-.035em;line-height:1}
.val-m{font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.unit{font-family:var(--mono);font-size:11.5px;color:var(--t3);font-weight:400;letter-spacing:0;margin-left:3px}

/* ---------- superficies ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-3)}
.horizon{position:relative;border-radius:var(--r-4);border:1px solid transparent;
  background:radial-gradient(420px 180px at var(--hx,30%) -40px,rgba(142,168,255,calc(.04 + var(--p,0)*.08)),transparent 70%),linear-gradient(180deg,#121419,#0D0F12) padding-box,
  linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.04) 30%,rgba(255,255,255,.025)) border-box;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 24px 48px -28px rgba(0,0,0,.95)}
.horizon::before{content:"";position:absolute;left:22px;right:22px;top:-1px;height:1px;background:linear-gradient(90deg,rgba(195,208,255,.9),var(--accent) calc(var(--p,0)*100%),rgba(255,255,255,.08) calc(var(--p,0)*100%));transition:background var(--d-3) var(--ease)}
.horizon::after{content:"";position:absolute;top:-3px;left:calc(22px + (100% - 44px)*var(--p,0));width:5px;height:5px;margin-left:-2.5px;border-radius:99px;background:#E6ECFF;box-shadow:0 0 10px 2px var(--accent-glow),0 0 24px 6px rgba(142,168,255,.18);transition:left var(--d-3) var(--ease)}
.horizon.complete::before{background:linear-gradient(90deg,rgba(195,208,255,.9),var(--accent),rgba(195,208,255,.9))}
.horizon.complete{box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 -8px 40px -16px rgba(142,168,255,.35),0 24px 48px -28px rgba(0,0,0,.95)}

/* ---------- controles ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border-radius:var(--r-2);font-size:13.5px;font-weight:550;white-space:nowrap;transition:background var(--d-1),box-shadow var(--d-1),transform var(--d-1) var(--ease),color var(--d-1)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn-primary{color:var(--accent-ink);background:linear-gradient(180deg,#A9BEFF,#8EA8FF);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 0 0 1px rgba(142,168,255,.55),0 8px 20px -10px var(--accent-glow)}
.btn-primary:hover:not(:disabled){box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 0 0 1px rgba(170,190,255,.8),0 10px 26px -10px var(--accent-glow)}
.btn-quiet{background:var(--surface-2);color:var(--t1);box-shadow:inset 0 0 0 1px var(--line-2)}
.btn-quiet:hover:not(:disabled){background:var(--surface-3);box-shadow:inset 0 0 0 1px #3A3F49}
.btn-ghost{color:var(--t2);padding:0 10px}
.btn-ghost:hover{color:var(--t1);background:var(--surface-2)}
.btn-sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:10px}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:var(--r-2);color:var(--t2);transition:background var(--d-1),color var(--d-1)}
.icon-btn:hover{background:var(--surface-2);color:var(--t1)}
.icon-btn .ic{font-size:19px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:99px;font-size:12.5px;color:var(--t2);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}
.medal{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:99px;font-size:11px;font-weight:600;letter-spacing:.03em;white-space:nowrap}
.medal::before{content:"";width:6px;height:6px;border-radius:99px;background:currentColor;box-shadow:0 0 6px currentColor}
.m-oro{color:var(--gold);background:linear-gradient(180deg,rgba(212,178,106,.16),rgba(212,178,106,.06));box-shadow:inset 0 0 0 1px rgba(212,178,106,.32)}
.m-plata{color:var(--silver);background:linear-gradient(180deg,rgba(194,199,208,.14),rgba(194,199,208,.05));box-shadow:inset 0 0 0 1px rgba(194,199,208,.28)}
.m-bronce{color:var(--bronze);background:linear-gradient(180deg,rgba(192,140,106,.16),rgba(192,140,106,.05));box-shadow:inset 0 0 0 1px rgba(192,140,106,.30)}
.m-bajo{color:var(--t2);background:transparent;box-shadow:inset 0 0 0 1px var(--line-2)}
.m-bajo::before{box-shadow:none;background:var(--t3)}
.m-none{color:var(--t3);box-shadow:inset 0 0 0 1px var(--line);background:transparent}
.m-none::before{background:transparent;box-shadow:inset 0 0 0 1px var(--t3)}
.bar{height:4px;border-radius:99px;background:#1A1D22;overflow:hidden;position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,#7C98F3,#B4C5FF);transition:width var(--d-3) var(--ease)}
.bar>i.ghost{background:repeating-linear-gradient(135deg,rgba(142,168,255,.55) 0 3px,rgba(142,168,255,.2) 3px 6px);opacity:.9}
.bar.neutral>i{background:#C9D0DC}
.bar.ok>i{background:var(--success)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--t2)}
.input{height:44px;padding:0 14px;border-radius:var(--r-2);background:var(--surface);border:1px solid var(--control);font-size:16px;color:var(--t1);transition:border-color var(--d-1),box-shadow var(--d-1)}
.input::placeholder{color:var(--t3)}
.input:hover{border-color:#7A818B}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(142,168,255,.18)}
.input.err{border-color:var(--danger)}
.input:disabled{opacity:.45}

/* ---------- casilla de hábito ---------- */
.check{position:relative;width:30px;height:30px;flex:none;border-radius:99px;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--control);color:var(--accent-ink);transition:background var(--d-2) var(--ease),box-shadow var(--d-2) var(--ease),transform var(--d-1) var(--ease)}
.check:hover{box-shadow:inset 0 0 0 1.5px var(--t2)}
.check:active{transform:scale(.9)}
.check svg{width:16px;height:16px;stroke-width:2.6;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset var(--d-2) var(--ease) 60ms}
.is-done .check{background:var(--accent);box-shadow:0 0 0 1px rgba(170,190,255,.7),0 0 16px -2px var(--accent-glow)}
.is-done .check svg{stroke-dashoffset:0}
.is-min .check{box-shadow:inset 0 0 0 1.5px var(--accent);background:linear-gradient(90deg,var(--accent) 50%,transparent 50%)}
.is-min .check svg{display:none}
.is-no .check{box-shadow:inset 0 0 0 1.5px var(--line-2);color:var(--t3)}
.is-no .check svg{display:none}
.is-no .check::after{content:"";width:12px;height:1.5px;background:var(--t3);border-radius:2px}
.xp-pop{position:absolute;right:4px;top:-4px;font-family:var(--mono);font-size:11px;color:var(--accent-2);pointer-events:none;animation:xp 700ms var(--ease) forwards}
@keyframes xp{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}

/* fila deslizable */
.hrow{position:relative;overflow:hidden;border-radius:var(--r-2)}
.hrow-bg{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-size:12.5px;font-weight:600;border-radius:var(--r-2)}
.hrow-bg .l{color:var(--accent-ink);display:flex;gap:6px;align-items:center}
.hrow-bg .r{color:var(--t1);display:flex;gap:6px;align-items:center}
.hrow-fg{position:relative;display:flex;align-items:center;gap:12px;padding:11px 12px;background:var(--surface);touch-action:pan-y;transition:transform var(--d-2) var(--ease),opacity var(--d-2)}
.hrow-fg.dragging{transition:none}
.h-ic{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;color:var(--t2);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);flex:none}
.h-ic .ic{font-size:16px}
.h-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.h-name{font-size:14.5px;font-weight:500;line-height:1.3}
.h-meta{font-size:12px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-xp{font-family:var(--mono);font-size:11.5px;color:var(--t3)}
.is-done .h-name{color:var(--t2)}
.is-done .h-ic{color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px rgba(142,168,255,.22)}
.hlist{display:flex;flex-direction:column;gap:6px}
.min-btn{font-family:var(--mono);font-size:11px;color:var(--t3);height:30px;padding:0 9px;border-radius:9px;box-shadow:inset 0 0 0 1px var(--line);transition:color var(--d-1),box-shadow var(--d-1)}
.min-btn:hover{color:var(--t1);box-shadow:inset 0 0 0 1px var(--line-2)}
.collapsed-group{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--r-2);color:var(--t2);font-size:13px;width:100%;text-align:left}
.collapsed-group:hover{background:var(--surface-2)}

/* ---------- hojas inferiores ---------- */
.scrim{position:absolute;inset:0;background:rgba(3,4,6,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;transition:opacity var(--d-2);z-index:20}
.scrim.open{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;max-height:88%;display:flex;flex-direction:column;border-radius:26px 26px 0 0;border:1px solid transparent;border-bottom:0;
  background:linear-gradient(180deg,#14161B,#0E1013) padding-box,linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.04) 30%) border-box;
  box-shadow:0 -24px 60px -20px rgba(0,0,0,.9);transform:translateY(102%);transition:transform var(--d-3) var(--spring)}
.sheet.open{transform:translateY(0)}
.sheet.dragging{transition:none}
.grab{flex:none;display:flex;justify-content:center;padding:10px 0 4px;cursor:grab;touch-action:none}
.grab i{width:38px;height:5px;border-radius:9px;background:var(--line-2)}
.sheet-body{overflow-y:auto;padding:6px 20px calc(24px + env(safe-area-inset-bottom,0px))}
@container app (min-width:980px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:520px;border-radius:22px;border-bottom:1px solid transparent;transform:translate(-50%,-46%) scale(.98);opacity:0;transition:transform var(--d-2) var(--ease),opacity var(--d-2)}
  .sheet.open{transform:translate(-50%,-50%);opacity:1}
  .grab{display:none}
  .sheet-body{padding:22px 24px 24px}
}
.log-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.log-tile{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:14px 12px 12px;border-radius:var(--r-2);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);text-align:left;font-size:13.5px;font-weight:500;transition:box-shadow var(--d-1),background var(--d-1),transform var(--d-1) var(--ease)}
.log-tile .ic{font-size:19px;color:var(--t2)}
.log-tile:hover{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.log-tile:hover .ic{color:var(--accent)}
.log-tile:active{transform:scale(.97)}
.log-tile small{display:block;font-size:11.5px;color:var(--t3);font-weight:400;margin-top:2px}
.repeat{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.repeat::-webkit-scrollbar{display:none}
.repeat .food{flex:none}

/* escala de check-in */
.scale5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale5 button{height:44px;border-radius:var(--r-2);box-shadow:inset 0 0 0 1px var(--line-2);font-family:var(--mono);font-size:14px;color:var(--t2);transition:all var(--d-1)}
.scale5 button:hover{color:var(--t1);box-shadow:inset 0 0 0 1px #3A3F49}
.scale5 button[aria-pressed="true"]{background:var(--accent-soft);color:var(--t1);box-shadow:inset 0 0 0 1px var(--accent),0 0 14px -6px var(--accent-glow)}
.slider{position:relative;height:44px;display:flex;align-items:center}
.slider input{width:100%;appearance:none;-webkit-appearance:none;background:transparent;height:44px;margin:0}
.slider input::-webkit-slider-runnable-track{height:4px;border-radius:9px;background:linear-gradient(90deg,var(--accent) var(--v),#1F2228 var(--v))}
.slider input::-moz-range-track{height:4px;border-radius:9px;background:linear-gradient(90deg,var(--accent) var(--v),#1F2228 var(--v))}
.slider input::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-10px;border-radius:99px;background:#F5F6F8;box-shadow:0 0 0 4px rgba(142,168,255,.25),0 2px 8px rgba(0,0,0,.6)}
.slider input::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:99px;background:#F5F6F8;box-shadow:0 0 0 4px rgba(142,168,255,.25)}
.ticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--t3);padding:0 6px}

/* ---------- toast ---------- */
.toast{position:absolute;left:50%;bottom:96px;z-index:30;transform:translate(-50%,20px);opacity:0;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 14px;border-radius:14px;background:#1A1D22;box-shadow:inset 0 0 0 1px var(--line-2),0 18px 40px -12px rgba(0,0,0,.9);font-size:13.5px;width:max-content;max-width:calc(100% - 32px);transition:transform var(--d-2) var(--spring),opacity var(--d-2);pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.toast .ic{color:var(--success)}
@container app (min-width:980px){.toast{bottom:28px}}

/* ---------- paleta de comandos (escritorio) ---------- */
.palette{position:absolute;left:50%;top:14%;z-index:40;width:min(560px,92%);transform:translate(-50%,-6px) scale(.985);opacity:0;pointer-events:none;border-radius:16px;border:1px solid transparent;background:linear-gradient(180deg,#15171C,#0F1114) padding-box,linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.05)) border-box;box-shadow:0 30px 80px -20px rgba(0,0,0,.95);transition:all var(--d-2) var(--ease)}
.palette.open{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.palette input{width:100%;height:52px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:0 18px;font-size:16px;outline:none}
.palette ul{list-style:none;margin:0;padding:6px;max-height:320px;overflow:auto}
.palette li button{width:100%;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;font-size:14px;color:var(--t2);text-align:left}
.palette li button[aria-selected="true"],.palette li button:hover{background:var(--surface-3);color:var(--t1)}

/* ---------- pantallas: comunes ---------- */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:20px}
.top-actions{display:flex;gap:4px;align-items:center}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 2px 10px}
.stack{display:flex;flex-direction:column;gap:12px}
.view{animation:viewIn var(--d-2) var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.view.deep{animation:viewDeep var(--d-3) var(--ease)}
@keyframes viewDeep{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}

/* ---------- Hoy · A Instrumento ---------- */
.hoy-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@container app (min-width:980px){.hoy-grid{grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:20px;align-items:start}.rail{position:sticky;top:0}}
.now{padding:20px 20px 16px}
.now-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.now-main{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:14px}
.now-title{font-size:21px;font-weight:600;letter-spacing:-.025em;line-height:1.2;text-wrap:balance}
.countdown{font-family:var(--mono);font-size:12.5px;color:var(--accent-2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.countdown .pulse{width:6px;height:6px;border-radius:99px;background:var(--accent);box-shadow:0 0 0 0 var(--accent-glow);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(142,168,255,.5)}70%{box-shadow:0 0 0 8px rgba(142,168,255,0)}100%{box-shadow:0 0 0 0 rgba(142,168,255,0)}}
.prio{display:flex;align-items:center;gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.prio-txt{flex:1;min-width:0}
.prio-txt .t{font-size:14.5px;font-weight:500}
.prio.is-done .t{color:var(--t3);text-decoration:line-through;text-decoration-color:var(--t3)}
.dayline{display:flex;align-items:center;gap:12px;margin-top:14px}
.ticks-day{flex:1;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px;height:14px;align-items:end}
.ticks-day i{height:6px;border-radius:2px;background:#1F2228;transition:height var(--d-2) var(--ease),background var(--d-2)}
.ticks-day i.d{height:14px;background:linear-gradient(180deg,#B4C5FF,#7C98F3)}
.ticks-day i.m{height:10px;background:rgba(142,168,255,.5)}
.next{padding:16px}
.next-card{display:flex;gap:14px;align-items:flex-start}
.next-card .h-ic{width:40px;height:40px;border-radius:12px}
.next-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.queue-move{animation:queue var(--d-3) var(--ease)}
@keyframes queue{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.signals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.signal{display:flex;flex-direction:column;gap:10px;padding:13px 14px;border-radius:var(--r-2);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);text-align:left;transition:box-shadow var(--d-1),background var(--d-1)}
.signal:hover{box-shadow:inset 0 0 0 1px var(--line-2);background:var(--surface-2)}
.signal[aria-expanded="true"]{grid-column:1/-1;box-shadow:inset 0 0 0 1px rgba(142,168,255,.35)}
.sig-head{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t2)}
.sig-head .ic{font-size:14px}
.sig-head .trend{margin-left:auto;font-family:var(--mono);font-size:11px}
.up{color:var(--success)}.down{color:var(--warn)}
.spark{display:none;height:56px;align-items:flex-end;gap:5px;margin-top:4px}
.signal[aria-expanded="true"] .spark{display:flex}
.spark i{flex:1;border-radius:3px 3px 1px 1px;background:#262A31;position:relative}
.spark i.today{background:linear-gradient(180deg,#B4C5FF,#7C98F3)}
.spark-axis{display:none;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--t3)}
.signal[aria-expanded="true"] .spark-axis{display:flex}
.attn{display:flex;flex-direction:column}
.attn-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.attn-row:first-child{border-top:0}
.sev{width:8px;height:8px;border-radius:99px;flex:none}
.sev.info{background:var(--accent);box-shadow:0 0 8px var(--accent-glow)}
.sev.warn{background:var(--warn);box-shadow:0 0 8px rgba(224,168,82,.5)}
.coach{padding:16px}
.coach p{margin:10px 0 0;font-size:14px;color:var(--t2);line-height:1.55}
.coach ol{margin:10px 0 0;padding-left:20px;color:var(--t1);font-size:14px;display:flex;flex-direction:column;gap:6px}
.coach ol li::marker{font-family:var(--mono);color:var(--accent);font-size:12px}

/* ---------- Hoy · B Línea del día ---------- */
.tl-head{display:flex;align-items:center;gap:16px;padding:16px 18px}
.ring{flex:none}
.ring circle{transition:stroke-dashoffset var(--d-3) var(--ease)}
.timeline{position:relative;margin-top:8px;padding-left:64px}
.timeline::before{content:"";position:absolute;left:52px;top:0;bottom:0;width:1px;background:linear-gradient(180deg,var(--line-2),var(--line) 70%,transparent)}
.slot{position:relative;padding:10px 0}
.slot-time{position:absolute;left:-64px;top:13px;width:44px;text-align:right;font-family:var(--mono);font-size:11.5px;color:var(--t3)}
.slot::before{content:"";position:absolute;left:-15.5px;top:18px;width:8px;height:8px;border-radius:99px;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--line-2)}
.slot.past::before{background:var(--line-2)}
.slot.past .blk{opacity:.55}
.slot.cur::before{background:var(--accent);box-shadow:0 0 0 3px rgba(142,168,255,.18),0 0 10px var(--accent-glow)}
.blk{padding:12px 14px;border-radius:var(--r-2);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.blk .t{font-size:14.5px;font-weight:500}
.int{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--line-2);color:var(--t2)}
.int.roja{color:#F0A39C;box-shadow:inset 0 0 0 1px rgba(229,118,111,.4)}
.nowline{position:relative;height:0;margin:6px 0 6px -16px}
.nowline::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,var(--accent),rgba(142,168,255,.15))}
.nowline span{position:absolute;left:-52px;top:-9px;font-family:var(--mono);font-size:11px;color:var(--accent-2);background:var(--bg);padding:0 4px}
.window{margin-top:6px}
.window .wh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}

/* ---------- Hábitos ---------- */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wday{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0 8px;border-radius:var(--r-2);color:var(--t3);font-size:11.5px;transition:background var(--d-1),box-shadow var(--d-1)}
.wday:hover{background:var(--surface-2)}
.wday[aria-pressed="true"]{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-2);color:var(--t1)}
.wday .d{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em}
.wday.future{opacity:.35}
.areas{display:flex;flex-direction:column}
.area-row{display:grid;grid-template-columns:28px minmax(0,1fr) 92px auto;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
.area-row:first-child{border-top:0}
.area-row .ic{font-size:16px;color:var(--t2)}
.area-row .n{font-size:14px}
.area-row .pct{font-family:var(--mono);font-size:11.5px;color:var(--t3);text-align:right}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.filters button[aria-pressed="true"]{color:var(--t1);background:var(--surface-3);box-shadow:inset 0 0 0 1px var(--line-2)}
.hab-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@container app (min-width:980px){.hab-grid{grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);align-items:start}}

/* ---------- Registro de comida ---------- */
.search{position:relative}
.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--t3)}
.search .input{width:100%;padding-left:40px}
.foods{display:flex;flex-wrap:wrap;gap:8px}
.food{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:11px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-size:13.5px;color:var(--t1);transition:all var(--d-1)}
.food small{font-family:var(--mono);font-size:11px;color:var(--t3)}
.food:hover{box-shadow:inset 0 0 0 1px var(--line-2);background:var(--surface-2)}
.food[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 1px rgba(142,168,255,.5)}
.food[aria-pressed="true"] small{color:var(--accent-2)}
.proj{padding:16px}
.proj-row{display:grid;grid-template-columns:76px minmax(0,1fr) auto;align-items:center;gap:12px;padding:6px 0}
.proj-row .v{font-family:var(--mono);font-size:12px;color:var(--t2);white-space:nowrap}
.proj-row .v b{color:var(--t1);font-weight:500}
.sel-list{display:flex;flex-direction:column}
.sel-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.sel-item:first-child{border-top:0}
.sel-item .k{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--t3)}
.savebar{position:sticky;bottom:0;padding:12px 0 4px;background:linear-gradient(180deg,transparent,var(--bg) 30%);display:flex;gap:10px;align-items:center}

/* ---------- Áreas ---------- */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@container app (min-width:980px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;gap:14px;padding:16px;border-radius:var(--r-3);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);text-align:left;transition:box-shadow var(--d-1),background var(--d-1),transform var(--d-1) var(--ease)}
.tile:hover{box-shadow:inset 0 0 0 1px var(--line-2);background:var(--surface-2)}
.tile:active{transform:scale(.985)}
.tile .top-row{display:flex;justify-content:space-between;align-items:center;color:var(--t2);font-size:13px}
.tile .top-row .ic{font-size:18px}
.mini{display:flex;align-items:flex-end;gap:3px;height:28px}
.mini i{flex:1;border-radius:2px;background:#262A31}
.mini i:last-child{background:var(--accent)}

/* ---------- vacío ---------- */
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:22px 20px}
.empty .glyph{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px rgba(142,168,255,.25)}
.empty .glyph .ic{font-size:20px}
.empty h3{margin:4px 0 0;font-size:16px;font-weight:600;letter-spacing:-.01em}
.empty p{margin:0;font-size:13.5px;color:var(--t2);max-width:46ch}

/* ---------- galería de estados ---------- */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.gal .panel{padding:16px}
.gal .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.state-lbl{font-family:var(--mono);font-size:10px;color:var(--t3);letter-spacing:.06em;text-transform:uppercase;display:block;margin-top:4px;text-align:center}
.force-hover{background:var(--surface-3)!important;box-shadow:inset 0 0 0 1px #3A3F49!important}
.force-focus{box-shadow:0 0 0 1px var(--bg),0 0 0 3px var(--accent-glow)!important}
.decision{font-size:13.5px;color:var(--t2)}
.decision table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
.decision th,.decision td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.decision th{font-family:var(--mono);font-weight:500;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--t3)}
.decision td.best{color:var(--accent-2)}
.tbl-wrap{overflow-x:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

function tween() {
  const el = document.querySelector('[data-tween="prot"]'); if (!el) return render(true)
  const from = parseInt(el.textContent.replace('.', '')) || 0, to = S.prot, t0 = performance.now()

// ---------- gestos: deslizar hábitos ----------
function bindSwipes() {
  document.querySelectorAll('.hrow').forEach((row) => {
    const fg = row.querySelector('.hrow-fg'), bg = row.querySelector('.hrow-bg'), id = row.dataset.hid
    let x0 = null, dx = 0, locked = false
    fg.onpointerdown = (e) => { if (e.pointerType === 'mouse' || e.target.closest('button')) return; x0 = e.clientX; dx = 0; locked = false; fg.classList.add('dragging') }
    fg.onpointermove = (e) => {
      if (x0 == null) return
      dx = e.clientX - x0
      if (!locked && Math.abs(dx) > 8) { locked = true; fg.setPointerCapture(e.pointerId) }
      if (!locked) return
      const lim = Math.max(-110, Math.min(110, dx))
      fg.style.transform = `translateX(${lim}px)`
      bg.style.background = lim > 0 ? `rgba(142,168,255,${Math.min(1, lim / 90)})` : `rgba(42,46,54,${Math.min(1, -lim / 90)})`
    }
    const end = () => {
      if (x0 == null) return
      fg.classList.remove('dragging'); fg.style.transform = ''; bg.style.background = ''
      if (dx > 80) setHabit(id, 'hecho'); else if (dx < -80) setHabit(id, 'minimo')
      x0 = null
    }
    fg.onpointerup = end; fg.onpointercancel = end
  })
}

}
function closePalette() { const p = document.getElementById('palette'); p.classList.remove('open'); setTimeout(() => (p.hidden = true), 200) }
function palItems() { const q = document.getElementById('pal-input').value.toLowerCase(); return CMDS.filter((c) => c[1].toLowerCase().includes(q)) }
function drawPal() { document.getElementById('pal-list').innerHTML = palItems().map((c, i) => `<li><button role="option" aria-selected="${i === palIdx}" data-i="${i}">${ic(c[0])}${c[1]}</button></li>`).join('') || '<li class="cap" style="padding:12px">Sin resultados</li>' }
document.getElementById('pal-input').oninput = () => { palIdx = 0; drawPal() }
document.getElementById('pal-list').onclick = (e) => { const b = e.target.closest('[data-i]'); if (b) { closePalette(); palItems()[+b.dataset.i][2]() } }
document.addEventListener('keydown', (e) => {
  const pal = !document.getElementById('palette').hidden
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); pal ? closePalette() : openPalette(); return }
  if (e.key === 'Escape') { if (pal) closePalette(); else closeSheet(); return }
  if (pal) {
    const n = palItems().length
    if (e.key === 'ArrowDown') { palIdx = (palIdx + 1) % n; drawPal(); e.preventDefault() }
    if (e.key === 'ArrowUp') { palIdx = (palIdx - 1 + n) % n; drawPal(); e.preventDefault() }
    if (e.key === 'Enter' && n) { closePalette(); palItems()[palIdx][2]() }
    return
  }
  if (e.target.matches('input,textarea')) return
  if (e.key.toLowerCase() === 'r') openSheet(sheetRegistrar)
  const map = { 1: 'hoy', 2: 'habitos', 3: 'fisico', 4: 'estudio', 5: 'finanzas', 6: 'vida' }
  if (map[e.key]) go(map[e.key])
})
// trampa de foco en la hoja
document.getElementById('sheet').addEventListener('keydown', (e) => {
  if (e.key !== 'Tab') return
  const f = [...e.currentTarget.querySelectorAll('button:not([disabled]),input')]; if (!f.length) return
  if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f.at(-1).focus() } else if (!e.shiftKey && document.activeElement === f.at(-1)) { e.preventDefault(); f[0].focus() }
})

if (!SCREENS[S.screen] || S.screen === 'registro' || S.screen === 'area') S.screen = 'hoy'
render()
</script>

</body></html>
